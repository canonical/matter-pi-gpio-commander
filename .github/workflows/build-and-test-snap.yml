name: Snap CI

on:
  schedule:
    - cron: "40 2 * * 1" # Monday morning 02:40 UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual trigger
  workflow_dispatch:

concurrency:
  group: snap-ci
  cancel-in-progress: false

env:
  ARTIFACT_ARM64: matter-pi-gpio-commander_${{ github.run_number}}_arm64

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    outputs:
      snap: ${{ steps.snapcraft.outputs.snap }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: snapcraft

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_ARM64 }}
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  publish-edge-arm64:
    # Only publish if we are on the main branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-arm64
    steps:
      - name: Download locally built snap
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_ARM64 }}

      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: ${{ needs.build-arm64.outputs.snap }}
          release: latest/edge

  test-arm64:
    runs-on: ubuntu-24.04-arm
    needs: build-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download locally built snap
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_ARM64 }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.*"
          cache: false

      - name: Run tests
        working-directory: tests
        env:
          MOCK_GPIO: true
          TEARDOWN: false
          SNAP_PATH: ../${{ needs.build-arm64.outputs.snap }}
        run: go test -failfast -p 1 -timeout 20m -v

      - name: Upload snap logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snap-logs
          path: tests/logs/*.log

  promote-beta-arm64:
    # Only promote if we are on the main branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-arm64, publish-edge-arm64, test-arm64]
    steps:
      - name: Install Snapcraft
        run: |
          sudo snap install snapcraft --classic
        shell: bash

      - name: Promote to beta
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        run: |
          snapcraft promote matter-pi-gpio-commander --yes \
            --from-channel latest/edge \
            --to-channel latest/beta
